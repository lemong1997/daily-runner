name: jobs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: routine or window
        default: routine
  schedule:
    - cron: "17 */2 * * *"
    - cron: "5 5 * * *"
    - cron: "35 12 * * *"

concurrency:
  group: acct
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ACCT_USER: ${{ secrets.ACCT_USER }}
          ACCT_PASS: ${{ secrets.ACCT_PASS }}
          ACCT_ZONE: ${{ vars.ACCT_ZONE }}
          MODE: ${{ github.event.inputs.mode || ((github.event.schedule == '5 5 * * *' || github.event.schedule == '35 12 * * *') && 'window' || 'routine') }}
        run: |
          echo "mode: $MODE  utc: $(date -u '+%H:%M:%S')  trigger: ${{ github.event.schedule || 'manual' }}"
          python3 runner.py "$MODE"
      - name: keep details
        if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          LOG_REPO: ${{ secrets.LOG_REPO }}
        run: |
          set +e
          [ -s detail.log ] || exit 0
          mkdir -p ~/.ssh && echo "$LOG_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null; echo "scan rc=$?"
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/k -o IdentitiesOnly=yes"
          git clone -q --depth 1 "git@github.com:$LOG_REPO.git" logrepo >/dev/null 2>&1; echo "clone rc=$?"
          [ -d logrepo/.git ] || { echo "details not kept"; exit 0; }
          mkdir -p logrepo/logs
          cat detail.log >> "logrepo/logs/$(TZ=Asia/Ho_Chi_Minh date +%F).txt"
          cd logrepo && git add -A >/dev/null
          git -c user.name=runner -c user.email=runner@users.noreply.github.com commit -q -m "log" >/dev/null 2>&1; echo "commit rc=$?"
          git push -q >/dev/null 2>&1 || { git pull -q --rebase >/dev/null 2>&1; git push -q >/dev/null 2>&1; }; echo "push rc=$?"
