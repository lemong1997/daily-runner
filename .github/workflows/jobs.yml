name: jobs

on:
  workflow_dispatch:
    inputs:
      mode:
        description: routine, window or war
        default: routine
      wait:
        description: max seconds a window run may wait
        default: "3600"
  schedule:
    - cron: "17 */2 * * *"
    - cron: "50 11 * * *"
    - cron: "50 4 * * *"
    - cron: "5 5 * * *"
    - cron: "15 12 * * *"
    - cron: "35 12 * * *"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
    concurrency:
      group: acct-${{ matrix.n }}-${{ (github.event.inputs.mode == 'war' || github.event.schedule == '50 11 * * *') && 'war' || 'main' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: run
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          ACCT_USER: ${{ secrets[format('ACCT_USER_{0}', matrix.n)] }}
          ACCT_PASS: ${{ secrets[format('ACCT_PASS_{0}', matrix.n)] }}
          ACCT_ZONE: ${{ vars[format('ACCT_ZONE_{0}', matrix.n)] }}
          NOT_BEFORE: ${{ vars[format('ROUTINE_FROM_{0}', matrix.n)] }}
          SKIP: ${{ vars[format('SKIP_{0}', matrix.n)] }}
          PICKED: ${{ github.event.inputs.mode }}
          MAX_WAIT: ${{ github.event.inputs.wait }}
          SCHED: ${{ github.event.schedule }}
        run: |
          MODE="$PICKED"
          if [ -z "$MODE" ]; then
            if [ "$SCHED" = "17 */2 * * *" ]; then MODE=routine; elif [ "$SCHED" = "50 11 * * *" ]; then MODE=war; else MODE=window; fi
          fi
          echo "slot ${{ matrix.n }}  mode: $MODE  utc: $(date -u '+%H:%M:%S')  trigger: ${SCHED:-manual}"
          python3 runner.py "$MODE"
      - name: keep details
        if: always()
        env:
          LOG_KEY: ${{ secrets.LOG_KEY }}
          LOG_REPO: ${{ secrets.LOG_REPO }}
        run: |
          set +e
          [ -s detail.log ] || exit 0
          mkdir -p ~/.ssh && echo "$LOG_KEY" > ~/.ssh/k && chmod 600 ~/.ssh/k
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/k -o IdentitiesOnly=yes"
          git clone -q --depth 1 "git@github.com:$LOG_REPO.git" logrepo >/dev/null 2>&1; echo "clone rc=$?"
          [ -d logrepo/.git ] || { echo "details not kept"; exit 0; }
          mkdir -p logrepo/logs
          cat detail.log >> "logrepo/logs/$(TZ=Asia/Ho_Chi_Minh date +%F)-a${{ matrix.n }}.txt"
          cd logrepo && git add -A >/dev/null
          git -c user.name=runner -c user.email=runner@users.noreply.github.com commit -q -m "log" >/dev/null 2>&1
          for i in 1 2 3; do git push -q >/dev/null 2>&1 && break; git pull -q --rebase >/dev/null 2>&1; done; echo "push rc=$?"
